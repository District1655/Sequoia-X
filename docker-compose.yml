# Sequoia-X Docker Compose（常驻调度模式）
#
# 一键启动（容器常驻，自动在每个工作日 19:15 跑选股 + 飞书推送）：
#   docker compose up -d
#
# 查看日志：
#   docker compose logs -f
#
# 首次手动回填（可选：容器首次启动检测到无数据库会自动回填，约12分钟）：
#   docker compose run --rm sequoia-x --backfill
#
# 立即手动跑一次：
#   docker compose run --rm sequoia-x --once

services:
  sequoia-x:
    build: .
    image: sequoia-x:latest
    container_name: sequoia-x

    # 从 .env 读取飞书 webhook 等配置（见 .env.example）
    env_file:
      - .env

    # SQLite 数据库持久化到宿主机
    volumes:
      - ./data:/app/data

    # 常驻服务：崩溃自动重启，开机自启
    restart: unless-stopped

    # 资源限制（8进程增量同步时的峰值上限）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

    # 日志轮转，避免 journald / json 日志撑爆磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
